# Public Bulletin metrics: Prometheus scrapes external collators, Grafana shows
# the data read-only to anyone, Caddy serves Grafana on the public subdomain
# with an automatic TLS certificate.
#
# The two operator-proxy-* services exist only for local testing. They play the
# role of an operator's reverse proxy in front of a collator.
name: bulletin-public-metrics

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      # Anonymous Grafana visitors can send their own queries; cap their cost.
      - --query.timeout=20s
      - --query.max-samples=10000000
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      default:
        # Fixed address so that the local operator proxies can allowlist it.
        # On the server, operators allowlist the server's public IP instead.
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080/}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bulletin-collators.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-:80}
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
      - "${PUBLIC_HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [grafana]
    restart: unless-stopped

  # --- Local testing only: stand-ins for operator reverse proxies. ---
  operator-proxy-nginx:
    profiles: [local]
    image: nginx:1.31-alpine
    environment:
      METRICS_UPSTREAM: host.docker.internal:9615
      PARITY_SCRAPER_IP: 172.30.0.10
    volumes:
      - ./operator-proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts: ["host.docker.internal:${HOST_GATEWAY:-host-gateway}"]

  operator-proxy-caddy:
    profiles: [local]
    image: caddy:2.11-alpine
    environment:
      METRICS_UPSTREAM: host.docker.internal:9715
      PARITY_SCRAPER_IP: 172.30.0.10
    volumes:
      - ./operator-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts: ["host.docker.internal:${HOST_GATEWAY:-host-gateway}"]

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  prometheus-data:
  grafana-data:
  caddy-data:
