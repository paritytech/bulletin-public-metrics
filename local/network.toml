# Local Bulletin network for testing the public metrics stack.
# Two collators stand in for two external operators, with metrics on ports
# 9615 and 9715. zombienet adds --prometheus-external, so these ports listen
# on all interfaces; a production collator keeps them on localhost.
[settings]
node_spawn_timeout = 240

[relaychain]
default_command = "{{POLKADOT_BINARY_PATH}}"
chain = "westend-local"

[[relaychain.nodes]]
name = "alice"
validator = true
rpc_port = 9942

[[relaychain.nodes]]
name = "bob"
validator = true
rpc_port = 9943

[[parachains]]
id = 1010
chain_spec_path = "./bulletin-westend-spec.json"
cumulus_based = true

[[parachains.collators]]
name = "operator-a"
command = "{{POLKADOT_PARACHAIN_BINARY_PATH}}"
validator = true
rpc_port = 10000
prometheus_port = 9615
args = ["--ipfs-server", "--enable-hop", "--hop-retention-secs 300", "--hop-check-interval 10", "--hop-promotion-buffer-secs 120", "--", "--listen-addr=/ip4/127.0.0.1/tcp/10003/ws", "-:--port"]

[[parachains.collators]]
name = "operator-b"
command = "{{POLKADOT_PARACHAIN_BINARY_PATH}}"
validator = true
rpc_port = 12346
prometheus_port = 9715
args = ["--ipfs-server", "--enable-hop", "--hop-retention-secs 300", "--hop-check-interval 10", "--hop-promotion-buffer-secs 120", "--", "--listen-addr=/ip4/127.0.0.1/tcp/12349/ws", "-:--port"]
